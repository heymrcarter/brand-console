# Tests the console, then deploys it to Cloudflare Workers. See docs/cloudflare.md.
# Settings come from this repository's Actions variables and secrets, never from wrangler.jsonc.
# Every push to main deploys. Changes to the console never release a design system version: the design system
# comes from the @heymrcarter/design-system packages, at the version in package.json.
name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: read lets npm ci install the private @heymrcarter/design-system packages. The packages' settings
# must give this repository access (Package settings > Manage Actions access).
permissions:
  contents: read
  packages: read

# One deploy at a time. A newer push waits for the one running, instead of stopping it halfway.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A hang must not use up the month's Actions minutes. A normal run takes a few minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@heymrcarter"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm test
      # The real Worker in wrangler dev, against a stand-in for GitHub. It needs no Cloudflare account.
      - run: npm run test:worker
        timeout-minutes: 5

  deploy:
    needs: test
    # Only this repository deploys the console. Copies and forks of it never do.
    if: github.repository == 'heymrcarter/brand-console'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ vars.REPO }}
      BRANCH: ${{ vars.BRANCH }}
      STORYBOOK_PREVIEW_URL: ${{ vars.STORYBOOK_PREVIEW_URL }}
      GH_APP_ID: ${{ vars.GH_APP_ID }}
      GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
      TEAM_DOMAIN: ${{ vars.TEAM_DOMAIN }}
      POLICY_AUD: ${{ vars.POLICY_AUD }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@heymrcarter"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      # Checks the settings before the long build, so a mistake fails in seconds with a clear message.
      - run: node scripts/deploy-worker.mjs --check
      - run: npm run worker:assets
      - run: node scripts/deploy-worker.mjs
