<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  color-scheme:light;
  /* Radix-style slate grays + indigo accent */
  --ink:#1C2024; --mute:#60646C; --ph:#6B6E76; --line:#E0E1E6; --btnline:#CDCED6; --paper:#F9F9FB; --card:#FFFFFF; --soft:#F0F0F3; --hover:#E8E8EC;
  --accent:#3E63DD; --accent-h:#3358D4; --on-accent:#FFFFFF; --accent-soft:#EDF2FE; --accent-line:#C1D0FF; --accent-text:#3A5BC7;
  --gbg:var(--accent-soft); --gline:var(--accent-line); --gink:var(--accent-text); --blue:var(--accent-text);
  --red:#B42328; --redbg:#FEEBEC; --redline:#F4A9AA; --green:#1A6B47; --greenbg:#E6F6EB; --amber:#8A4F00; --amberbg:#FFF7C2; --amberline:#F3D673;
  --lv1:#EDF2FE; --lv1t:#3A5BC7; --lv2:#E6F6EB; --lv2t:#1A6B47; --lv3:#FFF7C2; --lv3t:#8A4F00; --lv4:#FEE9F5; --lv4t:#A8206F;
  --shadow-1:0 1px 2px rgba(0,0,51,.06), 0 1px 3px rgba(0,0,51,.04);
  --shadow-2:0 4px 16px rgba(0,0,51,.08), 0 1px 3px rgba(0,0,51,.05);
  --checker-a:#F0F0F3; --checker-b:#F7F7F9;
  --font:-apple-system,"Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
/* The console always uses light colors. Only the component preview switches between light and dark. */
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}

/* prototype strip */
.proto{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:6px 16px;background:var(--soft);color:var(--mute);font-size:12px;border-bottom:1px solid var(--line)}
.proto b{color:var(--ink)}
.proto .sp{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.proto button{font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--btnline);border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap}

/* buttons */
.btn{font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--btnline);border-radius:6px;box-shadow:var(--shadow-1);padding:8px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.p{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.btn.s{font-size:12px;padding:6px 10px}
.btn.danger{color:var(--red);border-color:var(--redline)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:hover:not([disabled]){background:var(--soft)}
.btn.p:hover:not([disabled]){background:var(--accent-h)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.under{font-size:12px;color:var(--mute);line-height:1.5}
.label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.gbadge{border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{font-size:11px;font-weight:700;border-radius:4px;padding:3px 8px;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:var(--greenbg);color:var(--green)}
.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.bad{background:var(--redbg);color:var(--red)}
.pill.neutral{background:var(--soft);color:var(--mute)}
.xbtn{flex-shrink:0;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mute);cursor:pointer}
.xbtn:hover{border-color:var(--btnline);color:var(--red);background:var(--redbg)}
.inp.pname{font-weight:700;font-size:14px;padding:3px 6px;margin:-3px -6px 2px;border-color:transparent;background:transparent;max-width:100%}
.inp.pname:hover{border-color:var(--line)}.inp.pname:focus{border-color:var(--accent);background:var(--card)}
.paladd{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.brandrow:first-child{border-top:0;padding-top:0}
.brandrow .crow{flex-wrap:wrap}
.brandrow .cn .pill{display:inline-flex;margin-left:6px;vertical-align:1px}
.brandsw{display:inline-flex;flex-shrink:0}.brandsw .sw{width:22px;height:22px;border-radius:6px;margin-right:3px}
.brandfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.libgrid{display:flex;flex-direction:column;gap:3px;max-height:330px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.librow{display:grid;grid-template-columns:58px repeat(12,minmax(14px,26px));align-items:center;gap:3px}
.libn{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.libsw{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.08);cursor:pointer;padding:0}
.libsw:hover{transform:scale(1.15);position:relative;z-index:1}
.libsw.on{outline:2px solid var(--accent);outline-offset:2px}
.libpick{display:flex;align-items:center;gap:12px}
.libpick .cn{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute);min-width:0}.libpick .cn b{color:var(--ink);font-size:14px}
.libbig{width:44px;height:44px;border-radius:9px;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
tr.dim td{color:var(--mute)}
.flist{display:flex;flex-direction:column}
.frow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow.dim .fnm2{color:var(--mute)}
.fmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.fnm2{font-size:16px;font-weight:600}
.ffsel{display:flex;flex-wrap:wrap;gap:8px}.ffsel .sel{width:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.figopen{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 10px;padding:9px 12px;border:1px solid var(--btnline);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.figopen:hover{border-color:var(--accent);color:var(--accent-text)}
.figopen span:first-of-type{flex:1}
.figgrp{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.figrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.figrow.open{background:var(--amberbg);margin:0 -10px;padding:10px;border-radius:8px;border-bottom:0}
.figwhat{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.figvals{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.figvals > span{display:inline-flex;align-items:center;gap:6px}
.figquiet{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.figextra{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.figcol{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.figgo{display:flex;flex-direction:column;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.figerr{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--redbg);color:var(--red);font-size:13px}
.figsteps{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.55;color:var(--mute)}
.figfile{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bpks{display:flex;flex-wrap:wrap;gap:8px}
.bpk{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.bpk:hover{border-color:var(--btnline)}
.bpk.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.bpk-s{display:inline-flex;align-items:center;justify-content:center;width:42px;height:32px;border-radius:7px;border:2px solid transparent;font-weight:700;font-size:15px}
.bpk-n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}.bpk-n.lo{color:var(--red);font-weight:600}
.bpk-say{margin-top:8px;max-width:60ch}
.chip{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--btnline);border-radius:100px;padding:7px 12px;cursor:pointer;text-align:left}
.chip:hover{background:var(--soft)}
.iconbtn{width:30px;height:30px;border-radius:7px;background:transparent;color:var(--mute);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.iconbtn.bare{border:none}
.cnt{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* shell */
.top{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);gap:12px}
.top .t{font-size:14px;font-weight:700;white-space:nowrap}
.top .v{font-size:12px;color:var(--mute);white-space:nowrap}
.shell{flex-grow:1;display:flex;min-height:0;position:relative}
.nav{width:236px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.navlist{padding:10px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex-grow:1;min-height:0}
.navlist .label{padding:12px 10px 6px}
.navlist .label:first-child{padding-top:4px}
.nrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:none;background:none;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.nrow:hover{background:var(--soft)}
.nrow svg{color:var(--mute)}
.nrow.on{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.nrow.on svg{color:var(--accent-text)}
.nrow .m{margin-left:auto;font-size:11px;color:var(--mute);font-weight:600}
.nrow .m.bad{color:var(--red)}
.nrow svg{flex-shrink:0}
.draftbox{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.draftbox .dt{font-size:13px;font-weight:700}
.navsel{display:none}

.main{flex-grow:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex-grow:1;min-height:0;overflow:auto;padding:22px 28px 40px}
.page{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page.narrow{max-width:860px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.3;text-wrap:balance;margin-top:2px}
.lede{font-size:13.5px;color:var(--mute);line-height:1.55;max-width:70ch;margin-top:4px}
.gcard{display:flex;gap:10px;align-items:flex-start;background:var(--gbg);border:1px solid var(--gline);border-radius:12px;padding:14px 16px}
.gcard .b{font-size:14px;line-height:1.55}
.gcard .n{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.45}
.split{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;align-items:start}
.split > .pvcol{position:sticky;top:0}
.box{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-1);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box .bt{font-size:13.5px;font-weight:700}
.box .bs{font-size:12px;color:var(--mute);line-height:1.5;margin-top:-8px}
.field{display:flex;flex-direction:column;gap:6px}
.field > label, .field > .fl{font-size:12.5px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--mute);line-height:1.45}
.inp, select.sel{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--btnline);border-radius:7px;padding:7px 9px;min-width:0}
select.sel{padding-right:6px}
.inp.hex{font-family:var(--mono);font-size:12.5px;width:96px;text-transform:uppercase}
.inp.bad{border-color:var(--red)}
textarea.inp{width:100%;resize:vertical;line-height:1.5;min-height:84px}
.crow{display:flex;align-items:center;gap:10px}
.crow input[type=color]{width:40px;height:34px;border:1px solid var(--btnline);border-radius:7px;padding:2px;background:var(--card);cursor:pointer;flex-shrink:0}
.crow .cn{flex-grow:1;min-width:0}
.crow .cn b{display:block;font-size:13px}
.crow .cn span{display:block;font-size:11.5px;color:var(--mute);line-height:1.4}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
.seg button[disabled]{cursor:not-allowed;opacity:.5}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.scale div{height:30px;display:flex;align-items:flex-end;justify-content:center;font-size:9px;font-weight:600;padding-bottom:2px;font-variant-numeric:tabular-nums}
.scale div.base{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 3px var(--card)}
.scalewrap{display:flex;flex-direction:column;gap:6px}
.scale.s11{grid-template-columns:1.5fr repeat(10,minmax(0,1fr))}
.scale.s12{grid-template-columns:1.5fr repeat(11,minmax(0,1fr))}
.swbig{width:40px;height:34px;border-radius:7px;border:1px solid var(--btnline);flex-shrink:0}
.hexro{font-family:var(--mono);font-size:12.5px;color:var(--mute);background:var(--soft);border-radius:6px;padding:6px 8px}
.stp{height:38px;border:none;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font:600 9.5px/1 var(--font);font-variant-numeric:tabular-nums;cursor:pointer;padding:0 0 4px;position:relative}
.stp:hover{filter:brightness(1.06)}
.stp span.chip9{background:#FFFFFF;color:#1C2024;border-radius:3px;padding:1px 3px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.stp.on{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--card);z-index:1}
.stp:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;z-index:2}
.stp:first-child{border-right:2px solid var(--card)}
.palbar{display:flex;gap:6px;align-items:flex-start}
.palbar .pg{display:flex;flex-direction:column;gap:6px;min-width:0}
.palbar .segs{display:flex;height:40px;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.palbar .segs i{min-width:6px;display:block}
.pleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:-4px}
.pleg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pleg i{width:10px;height:10px;border-radius:3px;display:block}
.pgrp{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pickrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:-6px}
.pickrow .under{margin-right:2px}
.pk{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.pk.on{outline:2px solid var(--accent);outline-offset:2px}
.lockrow{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--mute);line-height:1.5;background:var(--soft);border-radius:8px;padding:9px 11px}
.lockrow svg{margin-top:2px;flex-shrink:0}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.aa{display:inline-flex;align-items:center;justify-content:center;width:38px;height:26px;border-radius:5px;font-weight:700;font-size:13px;border:1px solid rgba(0,0,0,.08)}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.12);vertical-align:-2px;margin-right:6px}
code, .code{font-family:var(--mono);font-size:12px}
.tok{font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:4px;padding:2px 5px;white-space:nowrap}

/* preview column */
.pvhead{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 0 0;border-bottom:none;padding:12px 14px}
.pvhead .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pvhead .r1 .t{font-size:13px;font-weight:700}
.pvctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.pvctl .g{display:flex;align-items:center;gap:6px}
.pvctl .g > span{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.pvbody{background:repeating-conic-gradient(var(--checker-a) 0% 25%, var(--checker-b) 0% 50%) 50%/16px 16px;position:relative;border:1px solid var(--line);border-radius:0 0 12px 12px;padding:16px;overflow:auto;max-height:calc(100vh - 230px);min-height:420px}
.pvnote{display:flex;gap:10px;align-items:center;background:var(--gbg);border:1px solid var(--gline);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;flex-wrap:wrap}
.pvframe{margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(28,26,23,.12),0 10px 30px rgba(28,26,23,.10)}
.pvframe.phone{max-width:390px;border-radius:26px;border:8px solid #22201C}
.trio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.trio .cap{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}

/* ============ PREVIEW: rendered from tokens only ============ */
.pv{font-family:var(--font-body);font-size:var(--text-base);line-height:var(--lh);color:var(--foreground);background:var(--page-fill,none) center/cover no-repeat,var(--background);-webkit-font-smoothing:antialiased}
.pv *{box-sizing:border-box}
.pv .h1{font-family:var(--font-heading);font-style:var(--heading-style,normal);font-size:var(--text-h1);font-weight:var(--heading-w);line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.pv .h2{font-family:var(--font-heading);font-style:var(--heading-style,normal);font-size:var(--text-h2);font-weight:var(--heading-w);line-height:1.25;margin:0}
.pv .h3{font-family:var(--font-heading);font-style:var(--heading-style,normal);font-size:var(--text-h3);font-weight:var(--heading-w);line-height:1.3;margin:0}
.pv p{margin:0}
.pv .muted{color:var(--muted-foreground)}
.pv .small{font-size:var(--text-sm)}
.pv a,.pv .lnk{color:var(--link);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.pv-stack{display:flex;flex-direction:column;gap:var(--gap)}
.pv-row{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(var(--gap)*.75) var(--pad);background:var(--card);border-bottom:1px solid var(--border)}
.pv-logo{display:flex;align-items:center;gap:8px;font-family:var(--font-heading);font-weight:800;font-size:calc(var(--text-base)*1.1)}
.pv-logo i{width:calc(var(--text-base)*1.4);height:calc(var(--text-base)*1.4);border-radius:calc(var(--radius) * .6);background:var(--primary);display:block}

.pv-terms{background:var(--muted);border-radius:var(--field-radius);padding:var(--gap);max-height:9em;overflow:auto;display:flex;flex-direction:column;gap:8px}

.grayrow{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}.grayrow span{flex:1}

/* labels and navigation use the label font */

.lvl.Primitive{background:var(--lv1);color:var(--lv1t)}.lvl.Component{background:var(--lv2);color:var(--lv2t)}.lvl.Composite{background:var(--lv3);color:var(--lv3t)}.lvl.Healthcare{background:var(--lv4);color:var(--lv4t)}
.libcat{display:flex;flex-direction:column;gap:8px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* brand switch above the page title */
.brandbar{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 auto 18px;max-width:1240px}
.brandbar .bbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.bbseg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
.bbseg button{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:15px;font-weight:700;color:var(--mute);background:transparent;border:none;border-radius:9px;padding:9px 20px;cursor:pointer;white-space:nowrap}

.bbseg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1),0 0 0 1px var(--line)}
/* canvas tools */
:root{--uia:#3E63DD}
.pickbox{position:absolute;border:2px solid var(--uia);border-radius:6px;pointer-events:none;z-index:6;box-shadow:0 0 0 4px rgba(62,99,221,.15)}
.pickbox span{position:absolute;left:-2px;top:-24px;background:var(--uia);color:#fff;font:600 11px/1 var(--font);padding:5px 8px;border-radius:5px;white-space:nowrap}
.pvbody .pv [class^="pv-"]:not(.pv-main):not(.pv-stack):not(.pv-row):not(.pv-grid2):not(.pv-grid3){cursor:pointer}
.is-reach{outline:2px dashed var(--uia) !important;outline-offset:3px;box-shadow:0 0 0 6px rgba(62,99,221,.16) !important;transition:outline-color .2s}

.pvcol{position:relative}
.reachwrap{position:sticky;top:0;height:0;z-index:8}
.reach{position:absolute;left:0;right:0;top:-4px;z-index:8;font-size:12.5px;line-height:1.5;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-2);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.reach.on{opacity:1;transform:none}
.ba{position:relative;display:grid;user-select:none;touch-action:pan-y}
.ba > .ba-l,.ba > .ba-r{grid-area:1/1;min-width:0;isolation:isolate}
.ba-r{clip-path:inset(0 0 0 var(--pos))}

.ba-ctl{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.ba-ctl input{width:100%;accent-color:var(--uia)}
/* helper panel */
.asst{width:344px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.asst-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}

.me-av{width:24px;height:24px;border-radius:50%;background:#B5502A;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prop{background:var(--card);border:1.5px solid var(--gline);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:9px;margin-top:8px}
.prop .ph{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gink)}
.chg{display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.45;padding-bottom:8px;border-bottom:1px solid var(--line)}

.chg .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px}
.chg .why{color:var(--mute);font-size:12px}
.asst-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg .chip{font-size:12px;padding:6px 10px}
.cmp{display:flex;align-items:center;gap:4px;padding:5px 5px 5px 12px;background:var(--card);border:1px solid var(--btnline);border-radius:12px;box-shadow:var(--shadow-2)}
.cmp:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-2)}
.cmp.rec{border-color:var(--red)}
.cmp input{flex-grow:1;min-width:0;border:none;outline:none;font:inherit;font-size:13.5px;color:var(--ink);background:transparent;padding:8px 0}
input::placeholder,textarea::placeholder{color:var(--ph);opacity:1}
.cmp .rec-t{flex-grow:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:13px;overflow:hidden}
.cmp .rec-t .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left;min-width:0}
.cbtn{width:38px;height:38px;border-radius:9px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn.dark{background:var(--accent)}
.cbtn.redb{background:var(--red)}
.bars{display:flex;align-items:center;gap:3px;height:22px;flex-shrink:0}
.bars i{width:3px;border-radius:2px;background:var(--red);animation:bar .9s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.think{display:inline-flex;gap:4px}

@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bars i,.think i{animation:none}}
.asst-c{width:56px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px}

.ck.block{border:1.5px solid var(--red);background:var(--card)}

.ck .wh{display:flex;gap:6px;flex-wrap:wrap}

.stat.bad .n{color:var(--red)} .stat.warn .n{color:var(--amber)} .stat.ok .n{color:var(--green)}

/* export */
.ftabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.ftabs button{font:inherit;font-family:var(--mono);font-size:11.5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--mute)}
.ftabs button.on{background:var(--accent-soft);color:var(--accent-text);color:var(--ink);font-weight:700}
pre.codebox{margin:0;background:#1F1D1A;color:#EDE9DF;border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow:auto;max-height:460px;white-space:pre}
pre.codebox .k{color:#E8B04B} pre.codebox .s{color:#9FD4B5} pre.codebox .c{color:#8C857A}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.step .sn{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step .st{font-size:13px;font-weight:700}
.step .sd{font-size:12.5px;color:var(--mute);line-height:1.5}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:13px;padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.banner{display:flex;gap:10px;align-items:center;background:var(--amberbg);border:1px solid var(--amberline);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.5}
fieldset.plain{border:none;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}

/* responsive */
@media (max-width:1320px){ .split{grid-template-columns:minmax(0,1fr)} .split > .pvcol{position:relative} .pvbody{max-height:none} }
@media (max-width:1100px){
  .asst{position:absolute;right:0;top:0;bottom:0;z-index:15;box-shadow:-12px 0 30px rgba(28,26,23,.14)}
}
@media (max-width:820px){
  html,body{height:auto}
  #app{height:auto;min-height:100%}
  .shell{flex-direction:column}
  .nav{width:auto;border-right:none;border-bottom:1px solid var(--line)}
  .navlist{display:none}
  .navsel{display:block;padding:10px 16px 0}
  .navsel select{width:100%}
  .draftbox{border-top:none}
  .scroll{overflow:visible;padding:18px 16px 90px}
  .asst{position:fixed;inset:0;width:auto;z-index:30}
  .asst-c{position:fixed;right:16px;bottom:16px;width:auto;height:auto;padding:0;border:none;background:transparent;z-index:20}
  .asst-c .vt,.asst-c .iconbtn{display:none}
  .asst-c .bigmic{width:56px;height:56px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .trio,.stats,.steps3{grid-template-columns:minmax(0,1fr)}
  .hide-s{display:none}
  .pvbody{padding:10px}
}

/* local app additions */
.boot{max-width:520px;margin:18vh auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.55;color:var(--ink);text-align:center}
.boot code{font-family:var(--mono);background:var(--soft);padding:2px 6px;border-radius:5px}
.who{font-size:12px;color:var(--mute);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sblink{font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--btnline);border-radius:6px;padding:3px 8px;text-decoration:none;white-space:nowrap}
a.btn{text-decoration:none}
.sbframe{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-2)}
.sbframe iframe{display:block;width:100%;height:680px;border:0;background:#fff}
.sbframe.phone{max-width:390px;margin:0 auto;border-radius:26px;border:8px solid #22201C}
</style>


</head>
<body>
<div id="app"></div>
<script type="module" src="engine-globals.js"></script>
<script defer src="app.js"></script>
</body>
</html>
